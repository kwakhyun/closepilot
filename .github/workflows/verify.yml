name: Verify portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: closepilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: closepilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closepilot -d closepilot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://closepilot:ci-only-password@localhost:5432/closepilot_ci
      DATABASE_URL: postgres://closepilot:ci-only-password@localhost:5432/closepilot_ci
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - name: Enforce unit coverage thresholds
        run: npm run test:coverage
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: npm run test:e2e
      - name: Rebuild deterministic evidence
        run: |
          npm run fixtures
          git diff --exit-code -- fixtures migrations
      - name: Exercise running API and database
        run: |
          npm start > /tmp/closepilot-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:3000 --report docs/evidence/api-smoke-ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-verification
          path: |
            docs/evidence/api-smoke-ci.json
            coverage/coverage-summary.json
            playwright-report
            test-results
            .data/local-close.json
            /tmp/closepilot-server.log
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Independent close-package replay
        working-directory: verifier
        run: bash gradlew test run --args='../fixtures/closed-package.json' --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-verification
          path: verifier/build/reports/tests/test
