openapi: 3.1.0
info:
  title: ClosePilot 데모 REST API
  version: 1.3.0
  description: |
    가상 데이터를 사용하는 매출 마감 데모입니다. 실제 결제, 송금, 회계 전표 생성은 수행하지 않습니다.
    AI 검토 메모 초안은 현재 거래에 저장된 합성 근거만 읽으며 금액을 바꾸거나 거래를 승인하고 마감할 권한이 없습니다.
    자료를 변경하는 요청에는 사이트 주소와 일치하는 Origin이 필요합니다.
    명령 실행에는 세션, expectedVersion, Idempotency-Key가 필요하며 금액은 원 단위 정수로 처리합니다.
servers:
  - url: /
security:
  - session: []
paths:
  /api/health:
    get:
      operationId: health
      security: []
      summary: 데이터베이스 연결 확인
      responses:
        "200":
          description: 데이터베이스에서 SELECT 1 실행에 성공했습니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  service: { const: closepilot }
                  storage: { enum: [postgresql, embedded-postgresql] }
                  mode: { const: synthetic-sandbox }
        "503":
          {
            description: 데이터베이스에 연결할 수 없습니다. 접속 비밀값은 응답에 포함하지 않습니다.,
          }
  /api/session:
    post:
      operationId: createSession
      summary: 30일 보관할 합성 작업과 6시간 접근 세션 생성
      description: |
        cloneCurrent=true이면 현재 세션 쿠키와 expectedVersion, brandName이 필요합니다.
        서버에 저장된 현재 프로필을 복제하며 templateId 또는 showcase와 함께 사용할 수 없습니다.
        profile 객체 등 클라이언트가 보낸 임의의 설정은 받지 않습니다.
        별도 HttpOnly 보관함 쿠키를 발급하며 같은 보관함은 최대 12개 작업을 보관합니다.
        기존 버전의 작업은 자동 편입하거나 보관 기간을 연장하지 않습니다.
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                templateId: { enum: [lumiere-beauty-v1, morrow-food-v1] }
                brandName: { type: string, minLength: 2, maxLength: 40 }
                cloneCurrent: { const: true }
                expectedVersion: { type: integer, minimum: 1 }
                period:
                  {
                    type: string,
                    pattern: "^(202[0-9]|203[0-5])-(0[1-9]|1[0-2])$",
                    description: "새 합성 작업의 월입니다. 생략하면 기본 프로필 기간을 사용합니다.",
                  }
                showcase:
                  {
                    const: completed,
                    description: "미리 검토와 마감을 완료한 읽기 전용 합성 예시를 생성합니다.",
                  }
      responses:
        "201":
          description: 가상 자료를 포함한 작업 공간과 HttpOnly·SameSite=Lax 쿠키를 생성합니다. 공개 배포에서는 Secure도 적용합니다.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: 같은 브라우저의 보관된 작업 목록
      description: 보관함 쿠키가 없으면 빈 목록입니다. 마지막으로 연 작업부터 최대 12개를 반환하며 인증 토큰은 포함하지 않습니다.
      security:
        - library: []
        - {}
      responses:
        "200":
          description: 보관 기간이 남은 작업 목록
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    maxItems: 12
                    items:
                      type: object
                      required: [id, scope, period, brand, status, createdAt, expiresAt]
                      properties:
                        id: { type: string, format: uuid }
                        scope: { type: string, description: 비인증용 작업 식별값 }
                        period: { type: string }
                        brand: { type: string }
                        status: { enum: [open, review, closed] }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: openWorkspace
      summary: 보관된 작업을 새 접근 세션으로 다시 열기
      description: UUID와 보관함 소유 권한을 함께 확인합니다. 마감 내용과 보관 만료일은 변경하지 않습니다.
      security:
        - library: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: 기존 작업과 새 HttpOnly 접근 세션 쿠키
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/imports/templates:
    get:
      operationId: listMappingTemplates
      summary: 같은 보관함과 현재 프로필에 저장한 열 연결 조회
      description: 유효한 작업 세션이 필요하며 보관함 쿠키가 없으면 빈 목록입니다. 자료 반영 때 저장된 매핑 스냅샷만 반환합니다.
      responses:
        "200":
          description: 최근 작업부터 최대 12개 설정
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    maxItems: 12
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        period: { type: string }
                        mappings:
                          type: object
                          properties:
                            orders: { type: object, additionalProperties: { type: string } }
                            settlements: { type: object, additionalProperties: { type: string } }
                            updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/workspace:
    get:
      operationId: getWorkspace
      summary: 현재 작업 상태, 대사 결과, 유효한 검토 승인 조회
      responses:
        "200":
          description: 사용자별 응답이며 캐시 저장을 허용하지 않습니다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceView" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/commands:
    post:
      operationId: executeCommand
      summary: 버전과 중복 요청을 확인하고 명령 실행
      description: |
        같은 요청 키와 본문으로 재시도하면 명령을 다시 적용하지 않고 최신 작업 상태를 반환합니다.
        같은 키에 다른 본문을 보내면 HTTP 409를 반환합니다.
        상태, 감사 이벤트, 요청 처리 이력은 하나의 트랜잭션에 저장합니다.
        웹 클라이언트는 X-Workspace-Scope로 현재 작업을 명시하며 다른 탭에서 전환된 경우 409로 거부합니다.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9_-]{16,100}$" }
        - name: X-Workspace-Scope
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ReconcileCommand"
                - $ref: "#/components/schemas/ResolveCommand"
                - $ref: "#/components/schemas/CloseCommand"
                - $ref: "#/components/schemas/ImportCommand"
                - $ref: "#/components/schemas/PolicyCommand"
                - $ref: "#/components/schemas/FollowupCommand"
              discriminator: { propertyName: action }
      responses:
        "200":
          description: 처리 후 작업 상태를 반환합니다. 검토를 승인해도 원본 금액은 바뀌지 않습니다.
          headers:
            Idempotency-Replayed: { schema: { type: string, enum: ["true", "false"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: 버전·요청 키 충돌, 재대사 필요, 미검토 거래, 마감 후 수정 또는 파일 중복 반영으로 요청을 거부했습니다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/imports/preview:
    post:
      operationId: previewImport
      summary: 작업 상태를 바꾸지 않고 CSV 검증과 반영 영향 미리보기
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, csv]
              properties:
                kind: { enum: [orders, settlements] }
                csv: { type: string, maxLength: 256000 }
                mapping: { $ref: "#/components/schemas/Mapping" }
                expectedVersion:
                  {
                    type: integer,
                    minimum: 1,
                    description: "생략하면 조회 시점의 버전을 사용합니다. 실제 반영에는 응답 impact.expectedVersion을 사용하세요.",
                  }
      responses:
        "200":
          description: 항목 검증에 실패하면 valid=false로 반환합니다. CSV 형식 자체가 잘못되면 HTTP 422를 반환할 수 있습니다.
          content:
            application/json:
              schema:
                type: object
                required: [valid, headers, mapping, count, preview, errors, issues, impact]
                properties:
                  valid: { type: boolean }
                  headers: { type: array, items: { type: string } }
                  mapping: { $ref: "#/components/schemas/Mapping" }
                  count: { type: integer, minimum: 0 }
                  preview: { type: array, items: { type: object } }
                  errors: { type: array, items: { type: string } }
                  issues:
                    type: array
                    description: 잘못된 행마다 첫 오류를 반환합니다. 파일 전체 오류는 row=0과 errors로 반환합니다.
                    items:
                      type: object
                      required: [row, field, message]
                      properties:
                        row: { type: integer, minimum: 0 }
                        field: { type: string }
                        message: { type: string }
                  impact:
                    type: [object, "null"]
                    properties:
                      expectedVersion: { type: integer }
                      before: { type: object, description: 반영 전 요약 }
                      after: { type: object, description: 반영 후 예상 요약 }
                      invalidatedReviews:
                        type: array
                        items:
                          type: object
                          properties:
                            rowKey: { type: string }
                            orderId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/policy/simulate:
    post:
      operationId: simulatePolicy
      summary: 현재 자료에 비교용 수수료율을 적용해 영향 계산
      description: 상태, 정책과 마감은 변경하지 않습니다. 마감된 작업에서도 비교할 수 있습니다.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, feeBps]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                feeBps:
                  type: object
                  additionalProperties: false
                  required: [d2c, naver, coupang]
                  properties:
                    d2c: { type: integer, minimum: 0, maximum: 10000 }
                    naver: { type: integer, minimum: 0, maximum: 10000 }
                    coupang: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: 전후 요약과 수수료 또는 대표 분류가 바뀌는 거래를 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required: [expectedVersion, feeBps, before, after, changes]
                properties:
                  expectedVersion: { type: integer }
                  feeBps: { type: object }
                  before: { type: object }
                  after: { type: object }
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        rowKey: { type: string }
                        orderId: { type: string }
                        beforeFee: { type: integer }
                        afterFee: { type: integer }
                        beforeKind: { type: string }
                        afterKind: { type: string }
                        needsReview: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/packages/inspect:
    post:
      operationId: inspectClosePackage
      summary: 업로드한 마감 증빙의 구조와 무결성을 읽기 전용으로 검사
      description: 최대 5,000,000바이트이며 서버에 저장하지 않습니다. TypeScript 재계산 검사로 서명이나 독립 Kotlin 검증을 대체하지 않습니다.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: /api/export?format=json에서 내려받은 원본 패키지 }
      responses:
        "200":
          description: 패키지 검사 실패는 valid=false와 package=null로 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required: [valid, checks, package]
                properties:
                  valid: { type: boolean }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, passed]
                      properties:
                        name: { type: string }
                        passed: { type: boolean }
                  package: { type: [object, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/followups:
    get:
      operationId: listFollowups
      summary: 같은 보관함과 브랜드의 이전 마감 이월 검토 근거 조회
      description: 활성 세션과 보관함 쿠키가 필요합니다. 실제 입금 확인이 아니며 조회는 상태를 변경하지 않습니다.
      responses:
        "200":
          description: 현재 버전과 작업 범위, 이전 마감별 후보 정산 및 검토 기록을 반환합니다. 보관함 쿠키가 없으면 sources는 빈 배열입니다.
          content:
            application/json:
              schema:
                type: object
                required: [expectedVersion, scope, sources]
                properties:
                  expectedVersion: { type: integer }
                  scope: { type: string }
                  sources: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Error" }
  /api/analysis:
    get:
      operationId: deterministicGuide
      summary: 원본 자료에 근거한 규칙 기반 검토 안내 조회
      description: LLM을 호출하지 않습니다. 표시용 설명은 저장된 대사 결과의 설명과 별도로 구성합니다.
      responses:
        "200":
          description: 미검토 거래를 대상으로 원본 자료가 연결된 안내를 최대 4건 제공합니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { const: deterministic }
                  title: { type: string }
                  summary: { type: string }
                  steps: { type: array, items: { type: object } }
                  guardrail: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/review-draft:
    post:
      operationId: createReviewDraft
      summary: 현재 거래의 저장된 근거로 선택형 검토 메모 초안 생성
      description: |
        읽기 전용 근거 도구와 구조화 출력 스키마를 사용합니다. 허용된 근거 ID 밖의 인용이나 승인 완료 단정은 폐기합니다.
        AI 호출을 완료하지 못하면 같은 근거로 만든 규칙 기반 초안을 반환합니다. 어떤 모드에서도 작업 상태는 바뀌지 않습니다.
        생성 시도는 UTC 기준 세션당 시간별 10회, 전체 일별 100회이며 동시 생성은 세션당 1건, 전체 4건입니다.
        한도 초과와 실행 중 중복 요청은 HTTP 200, mode=rules로 반환합니다. 동일한 근거, 모델, 프롬프트 버전의 성공한 초안은 같은 세션에서 재사용합니다.
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rowKey, expectedVersion]
              properties:
                rowKey: { type: string, minLength: 1, maxLength: 100 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: AI 또는 규칙 기반 초안과 근거 ID, 실행 모드를 반환합니다.
          headers:
            X-Review-Draft-Cache:
              description: 저장된 AI 초안을 재사용한 경우 hit입니다. generatedAt은 최초 생성 시각입니다.
              schema: { const: hit }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDraftResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/export:
    get:
      operationId: exportEvidence
      summary: 대사 결과 CSV 또는 확정한 마감 증빙 JSON 다운로드
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: 파일 다운로드 응답입니다. JSON은 마감 확정 후에만 내려받을 수 있습니다. CSV의 사용자 입력값은 스프레드시트 수식으로 실행되지 않도록 처리합니다.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [snapshot, audit, notice]
                properties:
                  snapshot:
                    {
                      type: object,
                      description: "전체 타입은 src/domain/model.ts의 CloseSnapshot을, 재현 가능한 예시는 fixtures/closed-package.json을 참고하세요.",
                    }
                  audit: { type: array, items: { type: object } }
                  notice: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    library:
      type: apiKey
      in: cookie
      name: closepilot_library
    session:
      type: apiKey
      in: cookie
      name: closepilot_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 프로토콜과 기본값이 아닌 포트 번호를 포함한 사이트의 정확한 출처 주소입니다.
      schema: { type: string, format: uri }
  responses:
    Error:
      description: 구조화된 오류 응답입니다. error.code와 error.message를 확인하세요.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            fields: { type: array, items: { type: object } }
    Mapping:
      type: object
      description: 표준 항목명과 업로드한 CSV 열 이름의 대응 관계입니다. 연결하지 않은 원본 열은 저장하지 않습니다.
      additionalProperties: { type: string, maxLength: 100 }
    PolicyCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, period, feeBps, note, evidence]
      properties:
        action: { const: apply_policy }
        expectedVersion: { type: integer, minimum: 1 }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        feeBps:
          type: object
          additionalProperties: false
          required: [d2c, naver, coupang]
          properties:
            d2c: { type: integer, minimum: 0, maximum: 10000 }
            naver: { type: integer, minimum: 0, maximum: 10000 }
            coupang: { type: integer, minimum: 0, maximum: 10000 }
        note: { type: string, minLength: 10, maxLength: 600 }
        evidence: { type: string, minLength: 5, maxLength: 200 }
    FollowupCommand:
      type: object
      additionalProperties: false
      required:
        [
          action,
          expectedVersion,
          sourceId,
          sourceHash,
          rowKey,
          settlementIds,
          status,
          note,
          evidence,
        ]
      properties:
        action: { const: record_followup }
        expectedVersion: { type: integer, minimum: 1 }
        sourceId: { type: string, format: uuid }
        sourceHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        rowKey: { type: string, minLength: 1, maxLength: 100 }
        settlementIds:
          { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 100 } }
        status: { enum: [waiting, evidence_reviewed] }
        note: { type: string, minLength: 10, maxLength: 600 }
        evidence: { type: string, minLength: 5, maxLength: 200 }
    ReconcileCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { const: reconcile }
        expectedVersion: { type: integer, minimum: 1 }
    CloseCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { const: close }
        expectedVersion: { type: integer, minimum: 1 }
    ResolveCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, rowKey, disposition, note, evidence]
      properties:
        action: { const: resolve }
        expectedVersion: { type: integer, minimum: 1 }
        rowKey: { type: string, minLength: 1, maxLength: 100 }
        disposition: { enum: [accepted_variance, carry_forward, exclude_duplicate] }
        note: { type: string, minLength: 10, maxLength: 600 }
        evidence: { type: string, minLength: 5, maxLength: 200 }
    ImportCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, kind, filename, csv]
      properties:
        action: { const: import }
        expectedVersion: { type: integer, minimum: 1 }
        kind: { enum: [orders, settlements] }
        filename:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: ".csv 확장자를 사용합니다. 파일명에는 영문, 숫자, 한글, 공백, 마침표, 밑줄, 괄호, 하이픈을 사용할 수 있습니다.",
          }
        csv: { type: string, minLength: 1, maxLength: 256000 }
        mapping: { $ref: "#/components/schemas/Mapping" }
        saveMapping:
          {
            type: boolean,
            description: "true이면 검증한 열 연결을 현재 온보딩 프로필 스냅샷에 함께 저장합니다.",
          }
    ReviewDraftResponse:
      type: object
      required: [mode, model, generatedAt, latencyMs, draft, notice]
      properties:
        mode: { enum: [ai, rules] }
        model: { type: [string, "null"] }
        generatedAt: { type: string, format: date-time }
        latencyMs: { type: integer, minimum: 0 }
        notice: { type: string }
        draft:
          type: object
          additionalProperties: false
          required: [summary, note, evidenceReference, checks, citations]
          properties:
            summary: { type: string, minLength: 20, maxLength: 280 }
            note: { type: string, minLength: 20, maxLength: 600 }
            evidenceReference: { type: string, minLength: 5, maxLength: 200 }
            checks: { type: array, minItems: 2, maxItems: 4, items: { type: string } }
            citations: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
    WorkspaceView:
      type: object
      description: 화면용 조회 응답입니다. 전체 타입은 src/application/workbench.ts의 WorkspaceView를 참고하세요. close는 요약 메타데이터만 포함하며 전체 마감 증빙은 /api/export?format=json으로 제공합니다.
      required:
        [
          version,
          period,
          asOf,
          status,
          orders,
          settlements,
          sources,
          rows,
          summary,
          events,
          auditValid,
          ruleVersion,
          sandbox,
          profile,
          availableProfiles,
          close,
        ]
      properties:
        version: { type: integer, minimum: 1 }
        period: { type: string, pattern: "^(202[0-9]|203[0-5])-(0[1-9]|1[0-2])$" }
        draftScope:
          { type: string, description: "탭별 임시 메모의 세션 구분용 값이며 인증 수단이 아닙니다." }
        reviewFingerprints:
          type: object
          additionalProperties: { type: string, pattern: "^[a-f0-9]{64}$" }
          description: 예외 거래 키에 대응하는 현재 승인 식별값입니다.
        asOf: { type: string, format: date }
        status: { enum: [open, review, closed] }
        close:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [hash, closedAt, closedBy]
              properties:
                hash: { type: string, pattern: "^[a-f0-9]{64}$" }
                closedAt: { type: string, format: date-time }
                closedBy: { type: string }
        orders: { type: array, items: { type: object } }
        settlements: { type: array, items: { type: object } }
        sources: { type: array, items: { type: object } }
        rows: { type: array, items: { type: object } }
        summary:
          {
            type: object,
            description: "원 단위 정수 합계와 건수입니다. 검토를 승인한 차액도 원본 금액에서 빼지 않습니다.",
          }
        events: { type: array, items: { type: object } }
        auditValid: { type: boolean }
        ruleVersion: { enum: [krw-net-v1.1.0, krw-net-v1.2.0] }
        sandbox: { const: true }
        demoMode:
          {
            enum: [fresh, completed-showcase],
            description: "completed-showcase는 실제 고객 승인이나 결제가 아닌 미리 완료한 합성 예시입니다.",
          }
        profile:
          {
            type: object,
            description: "현재 작업공간에 고정된 브랜드·채널·요율·열 연결·검토 규칙 버전입니다.",
          }
        availableProfiles:
          {
            type: array,
            description: "새 데모를 만들 때 선택할 수 있는 합성 온보딩 템플릿입니다.",
            items: { type: object },
          }
